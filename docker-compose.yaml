services:

  # =====================================================
  # Application
  # =====================================================

  todoapp:
    stop_grace_period: 90s
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp

    environment:
      # Application
      HTTP_ADDR: ":5050"
      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT}"
      OUTBOX_PUBLISHER_SHUTDOWN_TIMEOUT: "${OUTBOX_PUBLISHER_SHUTDOWN_TIMEOUT:-30s}"
      TIME_ZONE: "${TIME_ZONE}"
      # PostgreSQL
      POSTGRES_HOST: todoapp-postgres
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_TIMEOUT: "${POSTGRES_TIMEOUT}"
      # Redis
      REDIS_ADDR: redis:6379
      REDIS_USERNAME: "${REDIS_USERNAME:-default}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-5s}"
      # Logging
      LOGGER_LEVEL: "${LOGGER_LEVEL}"
      LOGGER_FOLDER: /app/out/logs
      # Deployment
      SERVICE_VERSION: "${SERVICE_VERSION:-dev}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092

    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs

    ports:
      - "5050:5050"

    depends_on:
      todoapp-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

    restart: always


  # =====================================================
  # Activity Worker
  # =====================================================

  activity-worker:
    stop_grace_period: 75s
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/activity-worker/Dockerfile

    environment:
      # Application
      TIME_ZONE: "${TIME_ZONE}"

      # PostgreSQL
      POSTGRES_HOST: todoapp-postgres
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_TIMEOUT: "${POSTGRES_TIMEOUT}"

      # Logging
      LOGGER_LEVEL: "${LOGGER_LEVEL}"
      LOGGER_FOLDER: /app/out/logs

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_CONSUMER_GROUP_ID: "${KAFKA_CONSUMER_GROUP_ID}"
      KAFKA_CONSUMER_CLIENT_ID: "${KAFKA_CONSUMER_CLIENT_ID}"
      KAFKA_CONSUMER_TOPIC: "${KAFKA_CONSUMER_TOPIC}"
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: "${KAFKA_CONSUMER_AUTO_OFFSET_RESET}"
      KAFKA_CONSUMER_DLQ_TOPIC: "${KAFKA_CONSUMER_DLQ_TOPIC}"
      KAFKA_CONSUMER_RETRY_BASE_DELAY: "${KAFKA_CONSUMER_RETRY_BASE_DELAY}"
      KAFKA_CONSUMER_RETRY_MAX_DELAY: "${KAFKA_CONSUMER_RETRY_MAX_DELAY}"
      KAFKA_CONSUMER_MAX_PENDING_MESSAGES: "${KAFKA_CONSUMER_MAX_PENDING_MESSAGES:-1000}"
      KAFKA_CONSUMER_SHUTDOWN_TIMEOUT: "${KAFKA_CONSUMER_SHUTDOWN_TIMEOUT:-30s}"

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SERVICE_VERSION: "${SERVICE_VERSION:-dev}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"

    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs

    depends_on:
      todoapp-postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

    restart: unless-stopped


  # =====================================================
  # Kafka Cluster
  # =====================================================

  kafka-1:
    build:
      context: ${PROJECT_ROOT}/monitoring/kafka
      dockerfile: Dockerfile
      args:
        KAFKA_IMAGE: apache/kafka:4.4.0
    hostname: kafka-1
    container_name: todoapp-kafka-1
    environment:
      # KRaft
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # Topics
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Local development
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_OPTS: "-javaagent:/opt/kafka/libs/jmx_prometheus_javaagent.jar=9404:/opt/kafka/config/jmx-exporter.yml"

    ports:
      - "127.0.0.1:29092:9092"

    volumes:
      - kafka-1-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:19092 describe --status >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

    restart: unless-stopped


  kafka-2:
    build:
      context: ${PROJECT_ROOT}/monitoring/kafka
      dockerfile: Dockerfile
      args:
        KAFKA_IMAGE: apache/kafka:4.4.0
    hostname: kafka-2
    container_name: todoapp-kafka-2
    environment:
      # KRaft
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://127.0.0.1:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # Topics
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Local development
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_OPTS: "-javaagent:/opt/kafka/libs/jmx_prometheus_javaagent.jar=9404:/opt/kafka/config/jmx-exporter.yml"

    ports:
      - "127.0.0.1:39092:9092"

    volumes:
      - kafka-2-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:19092 describe --status >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

    restart: unless-stopped


  kafka-3:
    build:
      context: ${PROJECT_ROOT}/monitoring/kafka
      dockerfile: Dockerfile
      args:
        KAFKA_IMAGE: apache/kafka:4.4.0
    hostname: kafka-3
    container_name: todoapp-kafka-3
    environment:
      # KRaft
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://127.0.0.1:49092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # Topics
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Local development
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_OPTS: "-javaagent:/opt/kafka/libs/jmx_prometheus_javaagent.jar=9404:/opt/kafka/config/jmx-exporter.yml"

    ports:
      - "127.0.0.1:49092:9092"

    volumes:
      - kafka-3-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:19092 describe --status >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

    restart: unless-stopped

  # ----------------------------
  # Kafka UI
  # ----------------------------

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: todoapp-kafka-ui

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      # Kafka Cluster
      KAFKA_CLUSTERS_0_NAME: 20h-project
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092

    restart: unless-stopped


  # =====================================================
  # Database
  # =====================================================

  # ----------------------------
  # PostgreSQL
  # ----------------------------

  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ----------------------------
  # Database Migrations
  # ----------------------------

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      todoapp-postgres:
        condition: service_started

  # ----------------------------
  # Local Database Access
  # ----------------------------

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      todoapp-postgres:
        condition: service_started


  # =====================================================
  # Cache
  # =====================================================

  # ----------------------------
  # Redis
  # ----------------------------

  redis:
    image: redis:8.2.11-bookworm
    container_name: todoapp-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped


  # =====================================================
  # API Documentation
  # =====================================================

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.26-alpine3.24
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code


  # =====================================================
  # Observability
  # =====================================================

  # ----------------------------
  # OpenTelemetry Collector
  # ----------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: todoapp-otel-collector
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ${PROJECT_ROOT}/monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  # ----------------------------
  # Metrics Collection
  # ----------------------------

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: todoapp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ${PROJECT_ROOT}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROJECT_ROOT}/out/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
      kafka-exporter:
        condition: service_started
    restart: unless-stopped

  # ----------------------------
  # Kafka Metrics Exporter
  # ----------------------------

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: todoapp-kafka-exporter
    command:
      - --kafka.server=kafka-1:19092
      - --kafka.server=kafka-2:19092
      - --kafka.server=kafka-3:19092
      - --web.listen-address=:9308
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------
  # Visualization
  # ----------------------------

  grafana:
    image: grafana/grafana:13.3.0
    container_name: todoapp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: sandbox.smtp.mailtrap.io:587
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: alerts@example.com
      GF_SMTP_FROM_NAME: Grafana
      GF_SMTP_STARTTLS_POLICY: OpportunisticStartTLS
    volumes:
      - ${PROJECT_ROOT}/out/grafana:/var/lib/grafana
      - ${PROJECT_ROOT}/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ${PROJECT_ROOT}/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ${PROJECT_ROOT}/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  # ----------------------------
  # Distributed Tracing
  # ----------------------------

  tempo:
    image: grafana/tempo:3.1.1
    container_name: todoapp-tempo
    command:
      - "-target=all"
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ${PROJECT_ROOT}/monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ${PROJECT_ROOT}/out/tempo:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  # ----------------------------
  # Log Storage
  # ----------------------------

  loki:
    image: grafana/loki:3.7.9
    container_name: todoapp-loki
    command:
      - -target=all
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ${PROJECT_ROOT}/monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ${PROJECT_ROOT}/out/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  # ----------------------------
  # Log Collection
  # ----------------------------

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: todoapp-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      TIME_ZONE: ${TIME_ZONE:-UTC}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
    volumes:
      - ${PROJECT_ROOT}/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${PROJECT_ROOT}/out/logs:/var/log/todoapp:ro
      - ${PROJECT_ROOT}/out/alloy:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped


# =====================================================
# Volumes for persistent storage
# =====================================================
volumes:
  # Kafka
  kafka-1-data:
    driver: local
  kafka-2-data:
    driver: local
  kafka-3-data:
    driver: local
